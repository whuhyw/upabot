[project]
name = "duckbot"
version = "0.1.0"
description = "QQ Bot — Apple Music to NetEase Cloud Music converter"
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "nb-cli>=1.7.4",
    "nonebot-plugin-orm>=0.7.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "pillow>=10.0.0",
]

[project.scripts]
duckbot = "duckbot.bot:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.nonebot]
adapters = ["nonebot.adapters.onebot.v11"]
plugins = ["duckbot.plugins.music_converter", "duckbot.plugins.device_commands", "duckbot.plugins.taboo"]
